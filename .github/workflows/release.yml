name: Release images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base image version to publish, e.g. 1.3.0"
        required: true
        type: string
      oak_webrtc_version:
        description: "oak_webrtc version to embed (empty = current stable)"
        required: false
        default: ""
        type: string
      latest:
        description: "Also push the `latest` tags (py312 image only)"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-images-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.image.suffix || 'py312' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - dockerfile: Dockerfile.py312
            suffix: ""
          - dockerfile: Dockerfile.py311
            suffix: py311
          - dockerfile: Dockerfile.py310
            suffix: py310
          - dockerfile: Dockerfile.c++
            suffix: cpp

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          SUFFIX: ${{ matrix.image.suffix }}
          PUSH_LATEST: ${{ inputs.latest }}
        run: |
          tag="${VERSION}${SUFFIX:+-$SUFFIX}"
          {
            echo "tags<<EOF"
            echo "luxonis/oakapp-base:${tag}"
            echo "quay.io/luxonis/oakapp-base:${tag}"
            if [ -z "$SUFFIX" ] && [ "$PUSH_LATEST" = "true" ]; then
              echo "luxonis/oakapp-base:latest"
              echo "quay.io/luxonis/oakapp-base:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            OAK_WEBRTC_VERSION=${{ inputs.oak_webrtc_version }}
